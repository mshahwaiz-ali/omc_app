name: One-shot final modal UIUX edges

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/uiux_final_modal_edges.py'
      - '.github/workflows/uiux-final-modal-edges.yml'

permissions:
  contents: write

jobs:
  apply-verify-land:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture authoritative head
        run: echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply final modal edge fixes
        run: python3 .github/scripts/uiux_final_modal_edges.py

      - name: Preserve modal and business authority
        shell: bash
        run: |
          set -euo pipefail
          grep -F "context.push('/signup')" omc_app/lib/features/home/presentation/home_screen_role_aware.dart
          grep -F "context.push('/login')" omc_app/lib/features/home/presentation/home_screen_role_aware.dart
          grep -F "isDismissible: false" omc_app/lib/features/leads/presentation/leads_screen.dart
          grep -F "showDiscardChangesDialog" omc_app/lib/features/leads/presentation/leads_screen.dart
          grep -F "isDismissible: false" omc_app/lib/features/service_requests/presentation/operational_service_case_detail_screen.dart
          grep -F "onUpload: (document, attachment)" omc_app/lib/features/service_requests/presentation/operational_service_case_detail_screen.dart
          grep -F "isFinancialHold" omc_app/lib/features/service_requests/presentation/operational_service_case_detail_screen.dart

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Format and diff check
        shell: bash
        run: |
          set -euo pipefail
          cd omc_app
          mapfile -t dart_files < <(git diff --name-only -- '*.dart' | sed 's#^omc_app/##')
          if ((${#dart_files[@]})); then
            dart format "${dart_files[@]}"
          fi
          cd ..
          git diff --check

      - name: Focused modal edge contract
        working-directory: omc_app
        run: flutter test --no-pub test/app/uiux_final_modal_edges_contract_test.dart

      - name: Existing related regressions
        working-directory: omc_app
        run: |
          flutter test --no-pub test/app/accessibility_design_contract_test.dart
          flutter test --no-pub test/features/home/home_async_feedback_guard_test.dart
          flutter test --no-pub test/resilience/mutation_safety_regression_test.dart
          flutter test --no-pub test/features/detail_mutation_resilience/detail_mutation_failure_test.dart

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze --no-pub

      - name: Full Flutter tests
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$BASE_HEAD" = "$(git rev-parse origin/main)" || { echo 'main moved; refusing stale source commit'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/uiux-final-modal-edges.yml .github/scripts/uiux_final_modal_edges.py
          git add omc_app
          git diff --cached --check
          git commit -m 'fix: close final modal uiux edges'
          git push origin HEAD:main
