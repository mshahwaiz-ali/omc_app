name: One-shot UI UX operational form standards A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-operational-form-standards-a.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply service and tax form standards
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_uiux_forms.py
          python3 /tmp/apply_uiux_forms.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Format touched Dart files
        shell: bash
        run: |
          dart format \
            omc_app/lib/core/widgets/app_labeled_field.dart \
            omc_app/lib/features/service_requests/presentation/service_request_draft_screen.dart \
            omc_app/lib/features/service_requests/presentation/service_request_draft_form_sections.dart \
            omc_app/lib/features/tax_calculator/presentation/tax_calculator_screen.dart \
            omc_app/test/core/widgets/app_labeled_field_test.dart
          git diff --check

      - name: Resolve dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Focused label primitive test
        working-directory: omc_app
        run: flutter test --no-pub test/core/widgets/app_labeled_field_test.dart

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze

      - name: Full Flutter tests
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified fixes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/uiux-operational-form-standards-a.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: standardize service and tax form labels'
          git push origin HEAD:main
