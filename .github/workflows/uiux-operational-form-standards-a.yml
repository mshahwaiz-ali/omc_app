      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Format touched Dart files
        shell: bash
        run: |
          dart format \
            omc_app/lib/core/widgets/app_labeled_field.dart \
            omc_app/lib/features/service_requests/presentation/service_request_draft_screen.dart \
            omc_app/lib/features/service_requests/presentation/service_request_draft_form_sections.dart \
            omc_app/lib/features/tax_calculator/presentation/tax_calculator_screen.dart \
            omc_app/lib/features/commissions/presentation/my_commissions_screen.dart \
            omc_app/lib/features/commissions/presentation/finance_commissions_screen.dart \
            omc_app/lib/features/payments/presentation/settlement_exceptions_screen.dart \
            omc_app/test/core/widgets/app_labeled_field_test.dart
          git diff --check

      - name: Resolve dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Focused operational form tests
        working-directory: omc_app
        run: |
          flutter test --no-pub \
            test/core/widgets/app_labeled_field_test.dart \
            test/features/commissions/commission_accessibility_test.dart \
            test/features/commissions/finance_commission_contract_test.dart \
            test/features/payments/finance_reconciliation_contract_test.dart

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze

      - name: Full Flutter tests
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified fixes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/uiux-operational-form-standards-a.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: standardize operational form labels'
          git push origin HEAD:main
