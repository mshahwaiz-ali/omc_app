name: One-shot UI UX operational form standards A

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-operational-form-standards-a.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited persistent-label fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: {label}: expected 1 anchor, found {count}')
              p.write_text(text.replace(old, new, 1))
              print(f'{path}: {label}')

          def add_import(path):
              p = Path(path)
              text = p.read_text()
              imp = "import '../../../core/widgets/app_labeled_field.dart';\n"
              if imp in text:
                  raise SystemExit(f'{path}: app_labeled_field import already present')
              anchor = "import '../../../app/theme.dart';\n"
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: theme import anchor is not unique')
              p.write_text(text.replace(anchor, anchor + imp, 1))
              print(f'{path}: added AppLabeledField import')

          helper = Path('omc_app/lib/core/widgets/app_labeled_field.dart')
          if helper.exists():
              raise SystemExit('AppLabeledField already exists; refusing ambiguous rerun')
