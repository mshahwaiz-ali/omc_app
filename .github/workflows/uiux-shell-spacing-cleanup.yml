name: One-shot UI UX shell spacing cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-shell-spacing-cleanup.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited shell spacing replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = {
              'omc_app/lib/features/home/presentation/approved_customer_home_view.dart': 150,
              'omc_app/lib/features/home/presentation/approved_customer_home_support.dart': 150,
              'omc_app/lib/features/home/presentation/customer_guest_home_view.dart': 150,
              'omc_app/lib/features/home/presentation/internal_home_view.dart': 150,
              'omc_app/lib/features/tasks/presentation/tasks_screen.dart': 164,
              'omc_app/lib/features/leads/presentation/leads_screen.dart': 164,
              'omc_app/lib/features/internal_workspace/presentation/internal_workspace_screen.dart': 164,
              'omc_app/lib/features/internal_workspace/presentation/internal_service_cases_screen.dart': 164,
              'omc_app/lib/features/internal_workspace/presentation/internal_operations_center_screen.dart': 164,
              'omc_app/lib/features/service_catalogue/presentation/service_catalogue_screen_impl.dart': 122,
              'omc_app/lib/features/service_catalogue/presentation/service_detail_screen_impl.dart': 122,
              'omc_app/lib/features/payments/presentation/payments_screen.dart': 132,
              'omc_app/lib/features/documents/presentation/documents_screen.dart': 132,
              'omc_app/lib/features/notifications/presentation/notifications_screen.dart': 132,
              'omc_app/lib/features/payments/presentation/payment_detail_screen.dart': 132,
              'omc_app/lib/features/documents/presentation/internal_document_review_screen.dart': 132,
          }

          part_file = 'omc_app/lib/features/home/presentation/approved_customer_home_support.dart'
          design_import = "import '../../../app/design_tokens.dart';\n"
          theme_import = "import '../../../app/theme.dart';\n"

          def ensure_design_import(path: str) -> None:
              if path == part_file:
                  return
              p = Path(path)
              text = p.read_text()
              if design_import in text:
                  return
              if text.count(theme_import) != 1:
                  raise SystemExit(f'{path}: could not locate unique theme import')
              p.write_text(text.replace(theme_import, design_import + theme_import, 1))
              print(f'{path}: added AppSpacing import')

          def replace_bottom_padding(path: str, old_bottom: int) -> None:
              p = Path(path)
              text = p.read_text()
              pattern = re.compile(
                  rf'EdgeInsets\.fromLTRB\((?P<args>[^)]*?),\s*{old_bottom}\)',
                  re.MULTILINE,
              )
              matches = list(pattern.finditer(text))
              if not matches:
                  raise SystemExit(
                      f'{path}: no fromLTRB padding found with bottom {old_bottom}'
                  )
              text = pattern.sub(
                  lambda m: f"EdgeInsets.fromLTRB({m.group('args')}, AppSpacing.xl)",
                  text,
              )
              if pattern.search(text):
                  raise SystemExit(f'{path}: audited bottom padding still remains')
              p.write_text(text)
              print(f'{path}: replaced {len(matches)} shell bottom padding occurrence(s)')

          for path, bottom in targets.items():
              ensure_design_import(path)
              replace_bottom_padding(path, bottom)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Format touched Dart files
        shell: bash
        run: |
          dart format \
            omc_app/lib/features/home/presentation/approved_customer_home_view.dart \
            omc_app/lib/features/home/presentation/approved_customer_home_support.dart \
            omc_app/lib/features/home/presentation/customer_guest_home_view.dart \
            omc_app/lib/features/home/presentation/internal_home_view.dart \
            omc_app/lib/features/tasks/presentation/tasks_screen.dart \
            omc_app/lib/features/leads/presentation/leads_screen.dart \
            omc_app/lib/features/internal_workspace/presentation/internal_workspace_screen.dart \
            omc_app/lib/features/internal_workspace/presentation/internal_service_cases_screen.dart \
            omc_app/lib/features/internal_workspace/presentation/internal_operations_center_screen.dart \
            omc_app/lib/features/service_catalogue/presentation/service_catalogue_screen_impl.dart \
            omc_app/lib/features/service_catalogue/presentation/service_detail_screen_impl.dart \
            omc_app/lib/features/payments/presentation/payments_screen.dart \
            omc_app/lib/features/documents/presentation/documents_screen.dart \
            omc_app/lib/features/notifications/presentation/notifications_screen.dart \
            omc_app/lib/features/payments/presentation/payment_detail_screen.dart \
            omc_app/lib/features/documents/presentation/internal_document_review_screen.dart
          git diff --check

      - name: Resolve dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze

      - name: Test
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/uiux-shell-spacing-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: remove duplicated shell bottom spacing'
          git push origin HEAD:main
