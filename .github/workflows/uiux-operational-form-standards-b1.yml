name: One-shot UI UX operational form standards B1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-operational-form-standards-b1.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply commission and payment form standards
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_uiux_forms_b1.py
          python3 /tmp/apply_uiux_forms_b1.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Format touched Dart files
        shell: bash
        run: |
          dart format \
            omc_app/lib/features/commissions/presentation/my_commissions_screen.dart \
            omc_app/lib/features/commissions/presentation/finance_commissions_screen.dart \
            omc_app/lib/features/payments/presentation/settlement_exceptions_screen.dart \
            omc_app/lib/features/payments/presentation/payment_detail_screen.dart
          git diff --check

      - name: Resolve dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Focused commission and payment tests
        working-directory: omc_app
        run: |
          flutter test --no-pub \
            test/features/commissions/commission_accessibility_test.dart \
            test/features/commissions/commission_contract_test.dart \
            test/features/commissions/finance_commission_contract_test.dart \
            test/features/payments/finance_reconciliation_contract_test.dart \
            test/features/payments/payment_receipt_upload_contract_test.dart

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze

      - name: Full Flutter tests
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified fixes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/uiux-operational-form-standards-b1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: standardize commission and payment form labels'
          git push origin HEAD:main
