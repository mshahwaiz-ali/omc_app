name: One-shot UI UX operational form standards B2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-operational-form-standards-b2.yml'

permissions:
  contents: write

jobs:
  apply-verify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply document and admin persistent labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def add_import(path):
              p = Path(path)
              text = p.read_text()
              imp = "import '../../../core/widgets/app_labeled_field.dart';\n"
              anchor = "import '../../../app/theme.dart';\n"
              if imp in text:
                  raise SystemExit(f'{path}: AppLabeledField import already present')
              if text.count(anchor) != 1:
                  raise SystemExit(f'{path}: expected one theme import anchor, found {text.count(anchor)}')
              p.write_text(text.replace(anchor, anchor + imp, 1))

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: {label}: expected one anchor, found {count}')
              p.write_text(text.replace(old, new, 1))
              print(f'{path}: {label}')

          document = 'omc_app/lib/features/documents/presentation/internal_document_review_screen.dart'
          admin = 'omc_app/lib/features/admin_control/presentation/admin_control_screen.dart'
          add_import(document)
          add_import(admin)

          replace_once(
              document,
              """            content: TextField(
              controller: controller,
              autofocus: true,
              minLines: 3,
              maxLines: 5,
              onChanged: (_) => setDialogState(() {}),
              decoration: const InputDecoration(
                labelText: 'Reason / reupload instruction',
                hintText:
                    'Example: CNIC image is unclear. Please upload again.',
              ),
            ),
""",
              """            content: AppLabeledField(
              label: 'Reason / reupload instruction',
              isRequired: true,
              child: TextField(
                controller: controller,
                autofocus: true,
                minLines: 3,
                maxLines: 5,
                onChanged: (_) => setDialogState(() {}),
                decoration: const InputDecoration(
                  hintText:
                      'Example: CNIC image is unclear. Please upload again.',
                ),
              ),
            ),
""",
              'document rejection reason',
          )

          replace_once(
              document,
              """          DropdownButtonFormField<String>(
            initialValue: selectedCustomerProfile ?? '',
            isExpanded: true,
            decoration: const InputDecoration(
              labelText: 'Customer',
              prefixIcon: Icon(Icons.person_search_rounded),
            ),
            items: [
              const DropdownMenuItem<String>(
                value: '',
                child: Text('All customers'),
              ),
              for (final option in customerOptions)
                DropdownMenuItem<String>(
                  value: option.profile,
                  child: Text(
                    [
                      option.label,
                      if (option.email?.trim().isNotEmpty == true)
                        option.email!.trim(),
                    ].join(' · '),
                  ),
                ),
            ],
            onChanged: (value) => onCustomerSelected(
              value == null || value.isEmpty ? null : value,
            ),
          ),
""",
              """          AppLabeledField(
            label: 'Customer',
            child: DropdownButtonFormField<String>(
              initialValue: selectedCustomerProfile ?? '',
              isExpanded: true,
              decoration: const InputDecoration(
                prefixIcon: Icon(Icons.person_search_rounded),
              ),
              items: [
                const DropdownMenuItem<String>(
                  value: '',
                  child: Text('All customers'),
                ),
                for (final option in customerOptions)
                  DropdownMenuItem<String>(
                    value: option.profile,
                    child: Text(
                      [
                        option.label,
                        if (option.email?.trim().isNotEmpty == true)
                          option.email!.trim(),
                      ].join(' · '),
                    ),
                  ),
              ],
              onChanged: (value) => onCustomerSelected(
                value == null || value.isEmpty ? null : value,
              ),
            ),
          ),
""",
              'customer filter',
          )

          replace_once(
              document,
              """          DropdownButtonFormField<String>(
            initialValue: selectedDocumentType ?? '',
            isExpanded: true,
            decoration: const InputDecoration(
              labelText: 'Document type',
              prefixIcon: Icon(Icons.category_outlined),
            ),
            items: [
              const DropdownMenuItem<String>(
                value: '',
                child: Text('All document types'),
              ),
              for (final option in documentTypeOptions)
                DropdownMenuItem<String>(value: option, child: Text(option)),
            ],
            onChanged: (value) => onDocumentTypeSelected(
              value == null || value.isEmpty ? null : value,
            ),
          ),
""",
              """          AppLabeledField(
            label: 'Document type',
            child: DropdownButtonFormField<String>(
              initialValue: selectedDocumentType ?? '',
              isExpanded: true,
              decoration: const InputDecoration(
                prefixIcon: Icon(Icons.category_outlined),
              ),
              items: [
                const DropdownMenuItem<String>(
                  value: '',
                  child: Text('All document types'),
                ),
                for (final option in documentTypeOptions)
                  DropdownMenuItem<String>(value: option, child: Text(option)),
              ],
              onChanged: (value) => onDocumentTypeSelected(
                value == null || value.isEmpty ? null : value,
              ),
            ),
          ),
""",
              'document type filter',
          )

          replace_once(
              document,
              """          DropdownButtonFormField<String>(
            initialValue: selectedGroup.reference,
            isExpanded: true,
            decoration: const InputDecoration(
              labelText: 'Service request',
              prefixIcon: Icon(Icons.folder_open_rounded),
            ),
            items: groups
                .map(
                  (group) => DropdownMenuItem<String>(
                    value: group.reference,
                    child: Text('${group.customerName} · ${group.reference}'),
                  ),
                )
                .toList(),
            onChanged: onSelected,
          ),
""",
              """          AppLabeledField(
            label: 'Service request',
            child: DropdownButtonFormField<String>(
              initialValue: selectedGroup.reference,
              isExpanded: true,
              decoration: const InputDecoration(
                prefixIcon: Icon(Icons.folder_open_rounded),
              ),
              items: groups
                  .map(
                    (group) => DropdownMenuItem<String>(
                      value: group.reference,
                      child: Text('${group.customerName} · ${group.reference}'),
                    ),
                  )
                  .toList(),
              onChanged: onSelected,
            ),
          ),
""",
              'service request selector',
          )

          replace_once(
              admin,
              """                  TextField(
                    controller: name,
                    decoration: const InputDecoration(
                      labelText: 'Existing staff full name',
                    ),
                    onChanged: (_) => setDialogState(() {}),
                  ),
                  const SizedBox(height: AppSpacing.sm),
                  TextField(
                    controller: email,
                    keyboardType: TextInputType.emailAddress,
                    decoration: const InputDecoration(
                      labelText: 'Existing staff login email',
                    ),
                    onChanged: (_) => setDialogState(() {}),
                  ),
""",
              """                  AppLabeledField(
                    label: 'Existing staff full name',
                    isRequired: true,
                    child: TextField(
                      controller: name,
                      decoration: const InputDecoration(),
                      onChanged: (_) => setDialogState(() {}),
                    ),
                  ),
                  const SizedBox(height: AppSpacing.sm),
                  AppLabeledField(
                    label: 'Existing staff login email',
                    isRequired: true,
                    child: TextField(
                      controller: email,
                      keyboardType: TextInputType.emailAddress,
                      decoration: const InputDecoration(),
                      onChanged: (_) => setDialogState(() {}),
                    ),
                  ),
""",
              'staff identity fields',
          )

          replace_once(
              admin,
              """                  TextField(
                    controller: controller,
                    autofocus: true,
                    keyboardType: const TextInputType.numberWithOptions(
                      decimal: true,
                    ),
                    decoration: InputDecoration(
                      labelText: 'Value',
                      prefixText: unit == '%' ? null : '$unit ',
                      suffixText: unit == '%' ? '%' : null,
                    ),
                    onChanged: (_) => setDialogState(() {}),
                  ),
""",
              """                  AppLabeledField(
                    label: 'Value',
                    isRequired: true,
                    child: TextField(
                      controller: controller,
                      autofocus: true,
                      keyboardType: const TextInputType.numberWithOptions(
                        decimal: true,
                      ),
                      decoration: InputDecoration(
                        prefixText: unit == '%' ? null : '$unit ',
                        suffixText: unit == '%' ? '%' : null,
                      ),
                      onChanged: (_) => setDialogState(() {}),
                    ),
                  ),
""",
              'business setting value',
          )
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Format touched Dart files
        shell: bash
        run: |
          dart format \
            omc_app/lib/features/documents/presentation/internal_document_review_screen.dart \
            omc_app/lib/features/admin_control/presentation/admin_control_screen.dart
          git diff --check

      - name: Resolve dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Focused B2 tests
        working-directory: omc_app
        run: |
          flutter test --no-pub \
            test/core/widgets/app_labeled_field_test.dart \
            test/features/admin_control/admin_operations_contract_test.dart \
            test/features/internal_workspace

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze --no-pub

      - name: Full Flutter tests
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified B2 source changes
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main moved during verification; refusing to push stale verified state'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            omc_app/lib/features/documents/presentation/internal_document_review_screen.dart \
            omc_app/lib/features/admin_control/presentation/admin_control_screen.dart
          git rm .github/workflows/uiux-operational-form-standards-b2.yml

          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: standardize document and admin form labels'
          git push origin HEAD:main
