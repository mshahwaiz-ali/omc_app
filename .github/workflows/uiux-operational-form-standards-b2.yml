name: One-shot UI UX operational form standards B2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-operational-form-standards-b2.yml'

permissions:
  contents: write

jobs:
  apply-verify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact B2 transform
        run: python3 .github/scripts/uiux_b2_transform.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Format touched Dart files
        shell: bash
        run: |
          dart format \
            omc_app/lib/features/documents/presentation/internal_document_review_screen.dart \
            omc_app/lib/features/admin_control/presentation/admin_control_screen.dart
          git diff --check

      - name: Resolve dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Focused B2 tests
        working-directory: omc_app
        run: |
          flutter test --no-pub \
            test/core/widgets/app_labeled_field_test.dart \
            test/features/admin_control/admin_operations_contract_test.dart \
            test/features/internal_workspace

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze --no-pub

      - name: Full Flutter tests
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified B2 source changes
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main moved during verification; refusing to push stale verified state'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            omc_app/lib/features/documents/presentation/internal_document_review_screen.dart \
            omc_app/lib/features/admin_control/presentation/admin_control_screen.dart
          git rm \
            .github/workflows/uiux-operational-form-standards-b2.yml \
            .github/scripts/uiux_b2_transform.py

          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: standardize document and admin form labels'
          git push origin HEAD:main
