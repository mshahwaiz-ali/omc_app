name: One-shot UI UX live sheet validation C1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-live-sheet-validation-c1.yml'

permissions:
  contents: write

jobs:
  apply-verify-and-land:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact C1 transform
        run: python3 .github/scripts/uiux_live_sheet_validation_c1.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Format touched Dart and test files
        shell: bash
        run: |
          dart format \
            omc_app/lib/features/profile/presentation/profile_v2_screen.dart \
            omc_app/lib/features/settings/presentation/settings_v2_screen.dart \
            omc_app/test/features/uiux/live_sheet_validation_contract_test.dart
          git diff --check

      - name: Resolve dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Focused C1 tests
        working-directory: omc_app
        run: |
          flutter test --no-pub \
            test/core/widgets/app_labeled_field_test.dart \
            test/features/uiux/live_sheet_validation_contract_test.dart \
            test/features/profile_resilience \
            test/features/settings

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze --no-pub

      - name: Full Flutter tests
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified C1 source changes
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main moved during verification; refusing to push stale verified state'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            omc_app/lib/features/profile/presentation/profile_v2_screen.dart \
            omc_app/lib/features/settings/presentation/settings_v2_screen.dart \
            omc_app/test/features/uiux/live_sheet_validation_contract_test.dart
          git rm \
            .github/workflows/uiux-live-sheet-validation-c1.yml \
            .github/scripts/uiux_live_sheet_validation_c1.py

          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: validate live profile and settings sheets'
          git push origin HEAD:main
