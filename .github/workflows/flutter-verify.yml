name: Flutter Verify

on:
  push:
    branches: [main]
    paths:
      - 'omc_app/**'
      - '.github/workflows/flutter-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: omc_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --no-pub
