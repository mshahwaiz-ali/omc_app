# final rerun with analyzer-clean Documents imports
name: One-shot routed page conformance batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-routed-pages-batch2.yml'

permissions:
  contents: write

jobs:
  apply-verify-land:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply routed page fixes
        run: |
          python3 .github/scripts/uiux_routed_pages_batch2.py
          python3 .github/scripts/uiux_routed_pages_batch2_cleanup.py

      - name: Preserve routing and business authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def require(token, source, label):
              if token not in source:
                  raise SystemExit(f'missing preserved contract: {label} -> {token}')

          router = Path('omc_app/lib/app/router.dart').read_text()
          profile = Path('omc_app/lib/features/profile/presentation/profile_v2_screen.dart').read_text()
          edit = Path('omc_app/lib/features/profile/presentation/edit_profile_v2_screen.dart').read_text()
          settings = Path('omc_app/lib/features/settings/presentation/settings_v2_screen.dart').read_text()
          password = Path('omc_app/lib/features/settings/presentation/change_password_screen.dart').read_text()
          customers = Path('omc_app/lib/features/customers/presentation/customers_screen.dart').read_text()
          docs = Path('omc_app/lib/features/documents/presentation/documents_screen.dart').read_text()
          doc_detail = Path('omc_app/lib/features/documents/presentation/document_detail_screen.dart').read_text()
          notification = Path('omc_app/lib/features/notifications/presentation/notification_detail_screen.dart').read_text()

          for token, label in [
              ('const ProfileV2Screen()', 'profile route'),
              ('const EditProfileV2Screen()', 'edit profile route'),
              ('const SettingsV2Screen()', 'settings route'),
              ('const ChangePasswordScreen()', 'change password route'),
              ('const CustomersScreen()', 'customers route'),
              ('CustomerDetailScreen(customerId: customerId)', 'customer detail route'),
              ('DocumentDetailScreen(', 'document detail route'),
              ('NotificationDetailScreen(notificationId: notificationId)', 'notification detail route'),
          ]:
              require(token, router, label)

          require('profileSummaryProvider', profile, 'profile provider')
          require('profileRepositoryProvider', edit, 'edit profile repository')
          require('DirtyFormController', edit, 'edit profile dirty-form guard')
          require('settingsPreferencesProvider', settings, 'settings preferences')
          require('authControllerProvider.notifier', password, 'password auth controller')
          require('changePassword(', password, 'password mutation')
          require('customersResultPageProvider', customers, 'customer paging provider')
          require('ref.watch(pageProvider)', customers, 'customer provider watch')
          require('documentPageProvider', docs, 'document paging provider')
          require('assistedDocumentPageProvider', docs, 'assisted document paging provider')
          require('documentsRepositoryProvider', doc_detail, 'document repository')
          require('invalidateDocumentMutation', doc_detail, 'document invalidation')
          require('markNotificationAsRead', notification, 'notification read mutation')
          require('notificationDetailProvider', notification, 'notification detail provider')
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Format and diff check
        shell: bash
        run: |
          dart format \
            omc_app/lib/core/widgets/omc_premium.dart \
            omc_app/lib/features/profile/presentation/profile_v2_screen.dart \
            omc_app/lib/features/profile/presentation/edit_profile_v2_screen.dart \
            omc_app/lib/features/settings/presentation/settings_v2_screen.dart \
            omc_app/lib/features/settings/presentation/change_password_screen.dart \
            omc_app/lib/features/customers/presentation/customers_screen.dart \
            omc_app/lib/features/customers/presentation/customer_detail_screen.dart \
            omc_app/lib/features/documents/presentation/documents_screen.dart \
            omc_app/lib/features/documents/presentation/document_detail_screen.dart \
            omc_app/lib/features/notifications/presentation/notification_detail_screen.dart \
            omc_app/test/app/uiux_routed_pages_batch2_test.dart
          git diff --check

      - name: Focused routed page contract
        working-directory: omc_app
        run: flutter test --no-pub test/app/uiux_routed_pages_batch2_test.dart

      - name: Existing route authority regression
        working-directory: omc_app
        run: flutter test --no-pub test/app/route_access_policy_test.dart

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze --no-pub

      - name: Full Flutter tests
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified source
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved; refusing stale push'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            omc_app/lib/core/widgets/omc_premium.dart \
            omc_app/lib/features/profile/presentation/profile_v2_screen.dart \
            omc_app/lib/features/profile/presentation/edit_profile_v2_screen.dart \
            omc_app/lib/features/settings/presentation/settings_v2_screen.dart \
            omc_app/lib/features/settings/presentation/change_password_screen.dart \
            omc_app/lib/features/customers/presentation/customers_screen.dart \
            omc_app/lib/features/customers/presentation/customer_detail_screen.dart \
            omc_app/lib/features/documents/presentation/documents_screen.dart \
            omc_app/lib/features/documents/presentation/document_detail_screen.dart \
            omc_app/lib/features/notifications/presentation/notification_detail_screen.dart \
            omc_app/test/app/uiux_routed_pages_batch2_test.dart
          git rm \
            .github/workflows/uiux-routed-pages-batch2.yml \
            .github/scripts/uiux_routed_pages_batch2.py \
            .github/scripts/uiux_routed_pages_batch2_cleanup.py
          git diff --cached --check
          git commit -m 'fix: close routed page responsive contracts'
          git push origin HEAD:main
