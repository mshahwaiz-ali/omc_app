name: One-shot routed expense V2 form closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-expense-v2-form-closure.yml'

permissions:
  contents: write

jobs:
  apply-verify-land:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply routed expense form closure
        run: python3 .github/scripts/uiux_expense_v2_form_closure.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Format and diff check
        shell: bash
        run: |
          dart format \
            omc_app/lib/features/expense_tracker/presentation/expense_tracker_v2_screen.dart \
            omc_app/lib/features/expense_tracker/presentation/expense_budget_v2_screen.dart
          git diff --check

      - name: Focused expense state tests
        working-directory: omc_app
        shell: bash
        run: |
          flutter test --no-pub test/batch3/expense_state_test.dart
          flutter test --no-pub test/batch3/expense_export_test.dart
          flutter test --no-pub test/features/app_config/app_gate_batch2_test.dart

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze --no-pub

      - name: Full Flutter tests
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified expense closure
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main moved during verification; refusing stale push'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            omc_app/lib/features/expense_tracker/presentation/expense_tracker_v2_screen.dart \
            omc_app/lib/features/expense_tracker/presentation/expense_budget_v2_screen.dart
          git rm \
            .github/workflows/uiux-expense-v2-form-closure.yml \
            .github/scripts/uiux_expense_v2_form_closure.py
          git diff --cached --check
          git commit -m 'fix: close routed expense form standards'
          git push origin HEAD:main
