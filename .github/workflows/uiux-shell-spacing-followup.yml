name: One-shot UI UX shell spacing follow-up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-shell-spacing-followup.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact audited padding replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'omc_app/lib/features/tasks/presentation/task_detail_screen.dart': [
                  ('EdgeInsets.fromLTRB(horizontal, 16, horizontal, 80)',
                   'EdgeInsets.fromLTRB(horizontal, 16, horizontal, AppSpacing.xl)', 1),
              ],
              'omc_app/lib/features/commissions/presentation/my_commissions_screen.dart': [
                  ('EdgeInsets.fromLTRB(horizontal, 16, horizontal, 80)',
                   'EdgeInsets.fromLTRB(horizontal, 16, horizontal, AppSpacing.xl)', 1),
              ],
              'omc_app/lib/features/profile/presentation/my_referrals_screen.dart': [
                  ('EdgeInsets.fromLTRB(horizontal, 16, horizontal, 140)',
                   'EdgeInsets.fromLTRB(horizontal, 16, horizontal, AppSpacing.xl)', 1),
              ],
              'omc_app/lib/features/profile/presentation/referral_detail_screen.dart': [
                  ('EdgeInsets.fromLTRB(horizontal, 16, horizontal, 100)',
                   'EdgeInsets.fromLTRB(horizontal, 16, horizontal, AppSpacing.xl)', 1),
              ],
              'omc_app/lib/features/payments/presentation/settlement_exceptions_screen.dart': [
                  ('EdgeInsets.fromLTRB(horizontal, 18, horizontal, 100)',
                   'EdgeInsets.fromLTRB(horizontal, 18, horizontal, AppSpacing.xl)', 1),
              ],
              'omc_app/lib/features/commissions/presentation/finance_commissions_screen.dart': [
                  ('EdgeInsets.fromLTRB(horizontal, 14, horizontal, 100)',
                   'EdgeInsets.fromLTRB(horizontal, 14, horizontal, AppSpacing.xl)', 1),
              ],
              'omc_app/lib/features/admin_control/presentation/admin_control_screen.dart': [
                  ('EdgeInsets.fromLTRB(horizontal, 16, horizontal, 100)',
                   'EdgeInsets.fromLTRB(horizontal, 16, horizontal, AppSpacing.xl)', 1),
              ],
              'omc_app/lib/features/admin_control/presentation/admin_operations_screen.dart': [
                  ('EdgeInsets.fromLTRB(horizontal, 14, horizontal, 100)',
                   'EdgeInsets.fromLTRB(horizontal, 14, horizontal, AppSpacing.xl)', 1),
              ],
          }

          for path, edits in replacements.items():
              p = Path(path)
              text = p.read_text()
              if "design_tokens.dart" not in text:
                  raise SystemExit(f'{path}: AppSpacing import is missing')
              for old, new, expected in edits:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(
                          f'{path}: expected {expected} occurrences of {old!r}, found {count}'
                      )
                  text = text.replace(old, new)
              p.write_text(text)
              print(f'{path}: updated')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Format touched Dart files
        shell: bash
        run: |
          dart format \
            omc_app/lib/features/tasks/presentation/task_detail_screen.dart \
            omc_app/lib/features/commissions/presentation/my_commissions_screen.dart \
            omc_app/lib/features/profile/presentation/my_referrals_screen.dart \
            omc_app/lib/features/profile/presentation/referral_detail_screen.dart \
            omc_app/lib/features/payments/presentation/settlement_exceptions_screen.dart \
            omc_app/lib/features/commissions/presentation/finance_commissions_screen.dart \
            omc_app/lib/features/admin_control/presentation/admin_control_screen.dart \
            omc_app/lib/features/admin_control/presentation/admin_operations_screen.dart
          git diff --check

      - name: Resolve dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze

      - name: Test
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/uiux-shell-spacing-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finish shell bottom spacing contract'
          git push origin HEAD:main
