name: One-shot routed profile V2 form closure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-profile-v2-form-closure.yml'

permissions:
  contents: write

jobs:
  apply-verify-land:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply routed profile form closure
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_profile_v2_form_closure.py
          python3 /tmp/apply_profile_v2_form_closure.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Format and diff check
        shell: bash
        run: |
          dart format omc_app/lib/features/profile/presentation/edit_profile_v2_screen.dart
          git diff --check

      - name: Resolve dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Focused profile resilience test
        working-directory: omc_app
        run: flutter test --no-pub test/features/profile_resilience/profile_failure_mapping_test.dart

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze --no-pub

      - name: Full Flutter tests
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified profile closure
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main moved during verification; refusing stale push'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omc_app/lib/features/profile/presentation/edit_profile_v2_screen.dart
          git rm .github/workflows/uiux-profile-v2-form-closure.yml
          git diff --cached --check
          git commit -m 'fix: close routed profile form standards'
          git push origin HEAD:main
