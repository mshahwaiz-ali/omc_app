  ) async {
    if (_isReviewingReceipt) return;
    final repository = ref.read(paymentsRepositoryProvider);
    final messenger = ScaffoldMessenger.of(context);
    PaymentReviewContext? reviewContext;

    if (status == 'Verified') {
