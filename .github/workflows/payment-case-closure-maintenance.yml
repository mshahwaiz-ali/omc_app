name: Payment and case closure maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/payment-case-closure-maintenance.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact source closure patch
        run: python tools/payment_case_closure_patch.py

      - name: Compile changed backend Python
        run: |
          python -m py_compile \
            backend_omc_app/frappe-bench/apps/omc_app/omc_app/api/workflow_automation.py \
            backend_omc_app/frappe-bench/apps/omc_app/omc_app/api/customer_lifecycle.py \
            backend_omc_app/frappe-bench/apps/omc_app/omc_app/api/workflow_contract.py \
            backend_omc_app/frappe-bench/apps/omc_app/omc_app/api/internal_workspace.py \
            backend_omc_app/frappe-bench/apps/omc_app/omc_app/setup/service_catalogue/provisioner.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Analyze Flutter closure
        working-directory: omc_app
        run: flutter analyze

      - name: Run Flutter test suite
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend_omc_app/frappe-bench/apps/omc_app/omc_app/api/workflow_automation.py
          git add backend_omc_app/frappe-bench/apps/omc_app/omc_app/api/test_payment_policy_completion.py
          git add backend_omc_app/frappe-bench/apps/omc_app/omc_app/api/customer_lifecycle.py
          git add backend_omc_app/frappe-bench/apps/omc_app/omc_app/api/workflow_contract.py
          git add backend_omc_app/frappe-bench/apps/omc_app/omc_app/api/internal_workspace.py
          git add backend_omc_app/frappe-bench/apps/omc_app/omc_app/setup/service_catalogue/provisioner.py
          git add omc_app/lib/core/config/api_config.dart
          git add omc_app/lib/features/payments/data/payment_item.dart
          git add omc_app/lib/features/payments/data/payments_repository.dart
          git add omc_app/lib/features/payments/presentation/widgets/payment_action_card.dart
          git add omc_app/lib/features/payments/presentation/payments_screen.dart
          git add omc_app/lib/features/payments/presentation/payment_detail_screen.dart
          git add omc_app/lib/features/internal_workspace/presentation/internal_operations_center_screen.dart
          git diff --cached --check
          git commit -m 'fix: close payment and case workflow parity'
          git push origin HEAD:main
