# diagnostic retry: isolate each live page surface before accepting source
name: One-shot live page contract batch one

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-live-page-contract-batch1.yml'

permissions:
  contents: write

jobs:
  apply-verify-land:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply confirmed live page fixes
        run: |
          python3 .github/scripts/uiux_live_page_contract_batch1.py
          python3 .github/scripts/uiux_live_page_contract_batch1_dashboard_states.py
          python3 .github/scripts/uiux_live_page_contract_batch1_test_split.py

      - name: Static authority invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          router = Path('omc_app/lib/app/router.dart').read_text()
          role = Path('omc_app/lib/features/home/presentation/home_screen_role_aware.dart').read_text()
          payments = Path('omc_app/lib/features/payments/presentation/payments_screen.dart').read_text()
          notifications = Path('omc_app/lib/features/notifications/presentation/notifications_screen.dart').read_text()
          assert 'CustomerGuestHomeView(' in role
          assert 'InternalHomeView(' in role
          assert 'homeDashboardSummaryProvider' in role
          assert 'paymentsProvider' in payments
          assert 'payment.requiresAction' in payments
          assert 'notificationPageProvider' in notifications
          assert 'markNotificationAsRead' in notifications
          assert 'dismissNotification' in notifications
          assert 'restoreNotification' in notifications
          assert 'const DashboardScreen()' in router
          assert 'const PaymentsScreen()' in router
          assert 'const NotificationsScreen()' in router
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: omc_app
        run: flutter pub get

      - name: Format and diff check
        shell: bash
        run: |
          dart format \
            omc_app/lib/core/widgets/omc_premium.dart \
            omc_app/lib/features/home/presentation/customer_guest_home_view.dart \
            omc_app/lib/features/home/presentation/internal_home_view.dart \
            omc_app/lib/features/dashboard/presentation/dashboard_screen.dart \
            omc_app/lib/features/payments/presentation/payments_screen.dart \
            omc_app/lib/features/notifications/presentation/notifications_screen.dart \
            omc_app/test/app/uiux_live_page_contract_batch1_test.dart
          git diff --check

      - name: Contract - responsive primitive
        working-directory: omc_app
        run: flutter test --no-pub test/app/uiux_live_page_contract_batch1_test.dart --plain-name 'V2 responsive page primitive implements C2 insets and bounded width'

      - name: Contract - live Home owners
        working-directory: omc_app
        run: flutter test --no-pub test/app/uiux_live_page_contract_batch1_test.dart --plain-name 'live Home owners use responsive page primitive'

      - name: Contract - Dashboard
        working-directory: omc_app
        run: flutter test --no-pub test/app/uiux_live_page_contract_batch1_test.dart --plain-name 'live Dashboard page states use C2 primitive'

      - name: Contract - Payments
        working-directory: omc_app
        run: flutter test --no-pub test/app/uiux_live_page_contract_batch1_test.dart --plain-name 'live Payments page states use C2 primitive'

      - name: Contract - Notifications
        working-directory: omc_app
        run: flutter test --no-pub test/app/uiux_live_page_contract_batch1_test.dart --plain-name 'live Notifications page states use C2 primitive'

      - name: Contract - status typography
        working-directory: omc_app
        run: flutter test --no-pub test/app/uiux_live_page_contract_batch1_test.dart --plain-name 'meaningful operational statuses do not use caption typography'

      - name: Existing Home hygiene regression
        working-directory: omc_app
        run: flutter test --no-pub test/app/home_placeholder_hygiene_test.dart

      - name: Existing route authority regression
        working-directory: omc_app
        run: flutter test --no-pub test/app/route_access_policy_test.dart

      - name: Analyze
        working-directory: omc_app
        run: flutter analyze --no-pub

      - name: Full Flutter tests
        working-directory: omc_app
        run: flutter test --no-pub

      - name: Commit verified source
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved; refusing stale push'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            omc_app/lib/core/widgets/omc_premium.dart \
            omc_app/lib/features/home/presentation/customer_guest_home_view.dart \
            omc_app/lib/features/home/presentation/internal_home_view.dart \
            omc_app/lib/features/dashboard/presentation/dashboard_screen.dart \
            omc_app/lib/features/payments/presentation/payments_screen.dart \
            omc_app/lib/features/notifications/presentation/notifications_screen.dart \
            omc_app/test/app/uiux_live_page_contract_batch1_test.dart
          git rm \
            .github/workflows/uiux-live-page-contract-batch1.yml \
            .github/scripts/uiux_live_page_contract_batch1.py \
            .github/scripts/uiux_live_page_contract_batch1_dashboard_states.py \
            .github/scripts/uiux_live_page_contract_batch1_test_split.py
          git diff --cached --check
          git commit -m 'fix: enforce live responsive page contracts'
          git push origin HEAD:main
